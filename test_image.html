<!DOCTYPE html>
<html>
<head>
    <title>Test Planogram Image</title>
</head>
<body>
    <h1>Test Planogram Image Loading</h1>
    <img src="http://localhost:5000/api/files/cohort_planograms/iphone_cohort_detailed_flagship.png" 
         alt="iPhone Cohort Planogram" 
         style="max-width: 100%; height: auto;"
         onload="console.log('Image loaded successfully')"
         onerror="console.error('Image failed to load')">
    
    <p>If you can see the iPhone cohort planogram above, then the image serving is working correctly!</p>
    
    <script>
        // Test the API endpoint directly
        fetch('http://localhost:5000/api/files/cohort_planograms/iphone_cohort_detailed_flagship.png')
            .then(response => {
                console.log('API Response Status:', response.status);
                console.log('API Response Headers:', [...response.headers.entries()]);
                return response.blob();
            })
            .then(blob => {
                console.log('Image blob size:', blob.size);
                console.log('Image blob type:', blob.type);
            })
            .catch(error => {
                console.error('API Error:', error);
            });
    </script>
</body>
</html>
